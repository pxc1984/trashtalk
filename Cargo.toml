[package]
name = "trashtalk"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "migrate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
dotenvy = "0.15.7"
rand = "0.10.2"
bincode = "1.3"
# Use rustls instead of the default native-tls/OpenSSL so the musl Docker
# build needs no system OpenSSL (pure-Rust TLS). Graceful shutdown is handled
# in main via tokio signals, so teloxide's ctrlc handler is not enabled.
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
