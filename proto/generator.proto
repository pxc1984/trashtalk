syntax = "proto3";

package trashtalk;

service TextGenerator {
  rpc GenerateText (GenerateTextRequest) returns (GenerateTextResponse);
  rpc TokenizePreview (TokenizePreviewRequest) returns (TokenizePreviewResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
  rpc ReloadTrainingData (ReloadTrainingDataRequest) returns (ReloadTrainingDataResponse);
}

message GenerateTextRequest {
  string prefix = 1;
  uint32 max_tokens = 2;
}

message GenerateTextResponse {
  string text = 1;
  uint32 tokens_generated = 2;
}

message TokenizePreviewRequest {
  string text = 1;
}

message TokenizePreviewResponse {
  repeated Token tokens = 1;
}

message Token {
  string token_type = 1;
  string token_value = 2;
  string emoji_document_id = 3;
}

message HealthCheckRequest {}

enum HealthStatus {
  OK = 0;
  DEGRADED = 1;
  ERROR = 2;
}

message HealthCheckResponse {
  HealthStatus status = 1;
  string message = 2;
}

message ReloadTrainingDataRequest {}

message ReloadTrainingDataResponse {
  bool reloaded = 1;
  string message = 2;
}
